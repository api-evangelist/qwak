name: Qwak
description: >-
  Qwak is an end-to-end production machine learning platform that lets data
  science and ML engineering teams build, train, deploy, monitor, and manage
  models with minimal engineering friction. The platform unifies MLOps, LLMOps,
  and a Feature Store, covering model registry and management, GPU/CPU training,
  production deployment as real-time API endpoints, batch inference or streaming,
  real-time monitoring and anomaly detection, LLM prompt management, and vector
  storage. Developers interact with the platform through the `qwak` CLI, the
  Python SDKs (qwak-sdk, qwak-core, qwak-inference), and a public Go SDK. Qwak
  was acquired by JFrog and rebranded JFrog ML; its documentation now lives on
  docs.jfrog.com and the successor SDK is `frogml`. Surfaced in the API
  Evangelist network as a portfolio company of Bessemer Venture Partners.
